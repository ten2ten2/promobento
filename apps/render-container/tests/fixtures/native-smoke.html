<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","default":"Native huashu motion"}]'>
<head>
<meta charset="utf-8">
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<script src="vendor/three.min.js"></script>
<style>
@font-face {font-family: Inter; src:url(assets/fonts/Inter-var.woff)}
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#13221f}
#film {width:100%;height:100%;position:relative;color:#f5f4df;font-family:Inter,sans-serif}
#card {position:absolute;inset:8%;border-radius:40px;background:#233b34;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:36px}
h1 {font-size:64px;line-height:1.05;text-align:center;margin:0;max-width:85%}
canvas {width:320px;height:320px;display:block}
#bar {position:absolute;bottom:0;left:0;height:16px;width:100%;background:#c9f082;transform-origin:left}
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-width="__WIDTH__" data-height="__HEIGHT__" data-duration="__DURATION__" data-fps="30" data-om-signature="off">
  <div id="card" data-om-id="card"><h1 data-om-id="headline" data-var-text="headline"></h1><canvas id="cube" width="320" height="320"></canvas></div>
  <div id="bar" data-om-id="progress"></div>
  <audio id="tone" src="assets/tone.wav" data-start="0" data-duration="__DURATION__"></audio>
</div>
<script>
const duration = __DURATION__;
const renderer = new THREE.WebGLRenderer({canvas:document.querySelector('#cube'),antialias:true,alpha:true});
renderer.setSize(320,320,false);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45,1,.1,100); camera.position.z = 5;
scene.add(new THREE.AmbientLight(0xffffff,2));
const light = new THREE.DirectionalLight(0xffffff,3); light.position.set(3,4,5); scene.add(light);
const cube = new THREE.Mesh(new THREE.BoxGeometry(1.8,1.8,1.8),new THREE.MeshStandardMaterial({color:0xc9f082,roughness:.25,metalness:.1}));
scene.add(cube);
const tl = gsap.timeline({paused:true});
tl.addLabel('scene:opening',0).fromTo('#card',{opacity:0,y:20},{opacity:1,y:0,duration:.8},0)
  .addLabel('scene:turn',duration/3).fromTo('#bar',{scaleX:0},{scaleX:1,duration,ease:'none'},0);
OM.clock(tl,t=>{cube.rotation.y=t*.4;cube.rotation.x=t*.17;renderer.render(scene,camera)},duration);
window.__timelines['film'] = tl;
</script>
</body>
</html>
