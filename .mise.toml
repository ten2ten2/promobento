# Tool versions and tasks. See docs/prd/08-codex-execution.md.
min_version = "2026.10.13"

[tools]
node = "26.12.0"
pnpm = "12.14.0"

[tasks.install]
description = "Install dependencies from the committed lockfile"
dir = "{{config_root}}"
run = "pnpm install --frozen-lockfile"

[tasks."check:repo"]
description = "check:repo: current specifications and references only"
dir = "{{config_root}}"
run = "node scripts/check-repo.mjs"

[tasks."check:contracts"]
description = "check:contracts: current specifications and references only"
dir = "{{config_root}}"
run = "node scripts/check-production-contracts.mjs"

[tasks."test:contracts"]
description = "test:contracts: current specifications and references only"
dir = "{{config_root}}"
run = "node --test scripts/*.test.mjs packages/contracts/test/*.test.mjs"

[tasks."build:agent-reference"]
description = "build:agent-reference: current specifications and references only"
dir = "{{config_root}}"
run = "node scripts/build-agent-reference.mjs"

[tasks."check:agent-reference"]
description = "check:agent-reference: current specifications and references only"
dir = "{{config_root}}"
run = "node scripts/check-agent-reference.mjs"
