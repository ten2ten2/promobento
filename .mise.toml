# Tool versions and tasks. See docs/prd/08-codex-execution.md.
min_version = "2026.10.13"

[tools]
node = "26.12.0"
pnpm = "12.14.0"

[tasks.install]
description = "Install dependencies from the committed lockfile"
dir = "{{config_root}}"
run = "pnpm install --frozen-lockfile"

[tasks."check:repo"]
description = "check:repo: current specifications and references only"
dir = "{{config_root}}"
run = "node scripts/check-repo.mjs"

[tasks."check:contracts"]
description = "check:contracts: current specifications and references only"
dir = "{{config_root}}"
run = "node scripts/check-production-contracts.mjs"

[tasks."test"]
description = "Run Node unit tests in scripts, packages, apps and tests"
dir = "{{config_root}}"
run = "pnpm run build:validators && node scripts/run-tests.mjs"

[tasks."build:film-runtime"]
description = "Build the trusted film page generator, clock shim, OM/clip helpers and nine trusted blocks"
dir = "{{config_root}}"
run = "node scripts/build-film-runtime.mjs"

[tasks."test:browser"]
description = "Run the offline browser/media check and style sample generation inside the CI image"
dir = "{{config_root}}"
run = "node apps/render-container/tests/browser.render.test.mjs"

[tasks."build:agent-reference"]
description = "build:agent-reference: current specifications and references only"
dir = "{{config_root}}"
run = "node scripts/build-agent-reference.mjs"

[tasks."check:agent-reference"]
description = "check:agent-reference: current specifications and references only"
dir = "{{config_root}}"
run = "node scripts/check-agent-reference.mjs"

[tasks."build:validators"]
description = "Precompile the v3 contract Schemas into standalone validators for Workers"
dir = "{{config_root}}"
run = "node packages/contracts/scripts/build-validators.mjs"

[tasks."typecheck"]
description = "Build validators and type-check the cloud Worker, film runtime and blocks"
dir = "{{config_root}}"
run = "pnpm run build:validators && pnpm --filter @promobento/cloud typecheck && pnpm exec tsc --project packages/film-runtime/tsconfig.json"
