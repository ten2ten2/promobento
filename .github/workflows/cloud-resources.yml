name: Cloud resources

# Creates the staging and production D1 databases, R2 buckets and Queues from
# apps/cloud/resources.json if they are missing. Manual only; safe to rerun.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-resources
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - name: Ensure D1, R2 and Queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise exec -- node apps/cloud/scripts/ensure-resources.mjs
