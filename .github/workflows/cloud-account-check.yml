name: Cloud account check

# Confirms account prerequisites before S1: Workers AI runs a model with the deploy token,
# and the preview domain is a zone on this account. Manual only.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Prerequisites, retained G1 metrics, or read-only partial deployment diagnosis
        type: choice
        options: [prerequisites, container-metrics, container-deployment]
        default: prerequisites
      version_id:
        description: Exact staging Worker version for container-deployment diagnosis
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - name: Check Workers AI and the preview zone
        if: inputs.scope == 'prerequisites'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise exec -- node apps/cloud/scripts/check-account.mjs
      - name: Read retained G1 platform metrics without starting compute
        if: inputs.scope == 'container-metrics'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise exec -- node apps/cloud/scripts/inspect-container-metrics.mjs
      - name: Diagnose exact staging deployment metadata without changing it
        if: inputs.scope == 'container-deployment'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSPECT_VERSION_ID: ${{ inputs.version_id }}
        run: mise exec -- node apps/cloud/scripts/inspect-container-deployment.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && inputs.scope == 'container-metrics'
        with:
          name: s1-container-metrics
          path: artifacts/container-metrics/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && inputs.scope == 'container-deployment'
        with:
          name: s1-container-deployment
          path: artifacts/container-deployment/
          if-no-files-found: error
