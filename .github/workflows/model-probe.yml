name: Model capability probe

# Measures what the OpenAI-compatible gateway supports for each model bound in
# docs/plans/cloud-motion-v3.md §6.11. Costs a few cents per run.
on:
  push:
    branches: ['probe/models']
    paths: ['research/model-probe/**', '.github/workflows/model-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe models
        env:
          MODEL_COMPAT_API_KEY: ${{ secrets.MODEL_COMPAT_API_KEY }}
          PROBE_MODELS: claude-sonnet-5-5,deepseek-v4.1-flash-1017
        run: node research/model-probe/probe.mjs https://api.modelswitch.org/v1 research/model-probe/results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: model-probe-report
          path: research/model-probe/results/
          if-no-files-found: warn
