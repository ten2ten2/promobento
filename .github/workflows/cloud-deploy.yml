name: Deploy S1 staging
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse_deployment:
        type: string
        default: ''
      inspect_run:
        type: string
        default: ''
      reconcile_operation:
        type: string
        default: ''
      renderer_sha:
        type: string
        default: ''
      renderer_digest:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cloud-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://promobento-staging.woffordvivian.workers.dev
      DEPLOYED_SHA: ${{ inputs.reuse_deployment || github.sha }}
      INSPECT_RUN: ${{ inputs.inspect_run }}
      RECONCILE_OPERATION: ${{ inputs.reconcile_operation }}
      RENDERER_SHA: ${{ inputs.renderer_sha }}
      RENDERER_DIGEST: ${{ inputs.renderer_digest }}
      WORKER_CONFIG: ${{ runner.temp }}/promobento-worker-only.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: inputs.reuse_deployment == '' && inputs.inspect_run == '' && inputs.renderer_digest == ''
      - name: Install pinned dependencies and precompile validators
        run: mise run install && mise run build:validators
      - name: Apply staging migration
        if: inputs.reuse_deployment == '' && inputs.inspect_run == ''
        run: mise exec -- pnpm --filter @promobento/cloud exec wrangler d1 migrations apply promobento-staging --env staging --remote
      - name: Build and push renderer, deploy Worker
        if: inputs.reuse_deployment == '' && inputs.inspect_run == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging
          if [[ -n "$RENDERER_DIGEST" ]]; then
            mise exec -- node apps/cloud/scripts/prepare-worker-deploy.mjs
            mise exec -- pnpm --filter @promobento/cloud exec wrangler deploy --env staging --config "$WORKER_CONFIG" 2>&1 | tee artifacts/staging/deploy.log
          else
            test -z "$RENDERER_SHA"
            mise exec -- pnpm --filter @promobento/cloud exec wrangler deploy --env staging 2>&1 | tee artifacts/staging/deploy.log
          fi
          printf '%s\n' "$GITHUB_SHA" > artifacts/staging/deployed-sha.txt
          url=$(grep -oE 'https://promobento-staging\.[a-z0-9-]+\.workers\.dev' artifacts/staging/deploy.log | head -1)
          test -n "$url"
          echo "STAGING_URL=$url" >> "$GITHUB_ENV"
      - name: Bind a masked run-only internal key
        if: inputs.inspect_run == ''
        shell: bash
        run: |
          [[ "$DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p artifacts/staging
          printf '%s\n' "$DEPLOYED_SHA" > artifacts/staging/deployed-sha.txt
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "EVAL_API_KEY=$key" >> "$GITHUB_ENV"
          printf '%s' "$key" | mise exec -- pnpm --filter @promobento/cloud exec wrangler secret put EVAL_API_KEY --env staging
      - name: One real 2D render through the deployed pipeline
        if: inputs.inspect_run == ''
        run: mise exec -- node apps/cloud/scripts/smoke-render.mjs
      - name: Read-only diagnosis of a prior staging run
        if: inputs.inspect_run != ''
        run: mise exec -- node apps/cloud/scripts/inspect-render.mjs
      - name: Preserve failed render diagnosis without another render
        if: failure() && inputs.inspect_run == '' && env.EVAL_API_KEY != ''
        env:
          INSPECT_RUN: ${{ github.run_id }}
        run: mise exec -- node apps/cloud/scripts/inspect-render.mjs
      - name: Revoke the run-only internal key
        if: always() && env.EVAL_API_KEY != ''
        run: mise exec -- pnpm --filter @promobento/cloud exec wrangler secret delete EVAL_API_KEY --env staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: s1-staging-deployment
          path: artifacts/staging/
          if-no-files-found: warn
