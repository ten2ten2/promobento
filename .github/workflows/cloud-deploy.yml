name: Deploy S1 staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Install pinned dependencies and precompile validators
        run: mise run install && mise run build:validators
      - name: Apply staging migration
        run: mise exec -- pnpm --filter @promobento/cloud exec wrangler d1 migrations apply promobento-staging --env staging --remote
      - name: Build and push renderer, deploy Worker
        shell: bash
        run: |
          mkdir -p artifacts/staging
          mise exec -- pnpm --filter @promobento/cloud exec wrangler deploy --env staging 2>&1 | tee artifacts/staging/deploy.log
          printf '%s\n' "$GITHUB_SHA" > artifacts/staging/deployed-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: s1-staging-deployment
          path: artifacts/staging/
          if-no-files-found: warn
