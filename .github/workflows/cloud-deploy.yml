name: Deploy staging infrastructure
on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy staging or inspect an existing operation without deploying
        type: choice
        options:
          - deploy
          - inspect
        default: deploy
        required: true
      deployed_sha:
        description: Source SHA of the existing deployment (inspect only)
        type: string
        default: ''
      inspect_run:
        description: Existing run ID for diagnostic attribution (inspect only)
        type: string
        default: ''
      inspect_operation:
        description: Existing operation ID to inspect (inspect only)
        type: string
        default: ''
      renderer_sha:
        description: Optional source SHA of an unchanged native renderer image
        type: string
        default: ''
      renderer_digest:
        description: Optional unchanged native renderer image digest
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cloud-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://promobento-staging.woffordvivian.workers.dev
      DEPLOYED_SHA: ${{ inputs.deployed_sha || github.sha }}
      INSPECT_RUN: ${{ inputs.inspect_run }}
      INSPECT_OPERATION: ${{ inputs.inspect_operation }}
      RENDERER_SHA: ${{ inputs.renderer_sha }}
      RENDERER_DIGEST: ${{ inputs.renderer_digest }}
      STAGING_ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - name: Check explicit deployment or inspection inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$STAGING_ACTION" == inspect ]]; then
            [[ "$INSPECT_RUN" =~ ^[0-9]{8,20}$ ]]
            [[ "$INSPECT_OPERATION" =~ ^[A-Za-z0-9_-]{4,96}$ ]]
            test -z "$RENDERER_SHA"
            test -z "$RENDERER_DIGEST"
          else
            test "$STAGING_ACTION" = deploy
            test -z "$INSPECT_RUN"
            test -z "$INSPECT_OPERATION"
            if [[ -n "$RENDERER_DIGEST" ]]; then
              [[ "$RENDERER_SHA" =~ ^[a-f0-9]{40}$ ]]
              [[ "$RENDERER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            else
              test -z "$RENDERER_SHA"
            fi
          fi
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        if: inputs.action == 'deploy' && inputs.renderer_digest == ''
      - name: Install pinned dependencies and precompile validators
        run: mise run install && mise run build:validators
      - name: Build the Web SSR Worker and static assets
        if: inputs.action == 'deploy'
        run: mise run build:web
      - name: Apply additive staging migrations
        if: inputs.action == 'deploy'
        run: |
          mise exec -- pnpm --filter @promobento/cloud exec wrangler d1 migrations apply promobento-staging --env staging --remote
          mise exec -- pnpm --filter @promobento/cloud exec wrangler d1 migrations apply promobento-model-ledger --env staging --remote
      - name: Build native renderer and deploy Worker
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging
          if [[ -n "$RENDERER_DIGEST" ]]; then
            export WORKER_CONFIG="$RUNNER_TEMP/promobento-worker-only.json"
            mise exec -- node apps/cloud/scripts/prepare-worker-deploy.mjs
            mise exec -- pnpm --filter @promobento/cloud exec wrangler deploy --env staging --config "$WORKER_CONFIG" 2>&1 | tee artifacts/staging/deploy.log
          else
            mise exec -- pnpm --filter @promobento/cloud exec wrangler deploy --env staging 2>&1 | tee artifacts/staging/deploy.log
          fi
          printf '%s\n' "$GITHUB_SHA" > artifacts/staging/deployed-sha.txt
      - name: Deploy the Preview and Web service boundaries
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          mise exec -- pnpm --filter @promobento/preview exec wrangler deploy --env staging 2>&1 | tee artifacts/staging/preview-deploy.log
          mise exec -- pnpm --filter @promobento/web exec wrangler deploy --env staging 2>&1 | tee artifacts/staging/web-deploy.log
      - name: Probe Access-protected SaaS staging routes when configured
        if: inputs.action == 'deploy'
        env:
          STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
          STAGING_PREVIEW_URL: ${{ vars.STAGING_PREVIEW_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: mise exec -- node apps/cloud/scripts/probe-saas-staging.mjs
      - name: Bind a masked run-only internal key for readback
        if: inputs.action == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "EVAL_API_KEY=$key" >> "$GITHUB_ENV"
          printf '%s' "$key" | mise exec -- pnpm --filter @promobento/cloud exec wrangler secret put EVAL_API_KEY --env staging
      - name: Read deployed health, idle capacity and budget without creating an operation
        if: inputs.action == 'deploy'
        run: mise exec -- node apps/cloud/scripts/deployment-health.mjs
      - name: Read-only inspection of an existing operation
        if: inputs.action == 'inspect'
        run: mise exec -- node apps/cloud/scripts/inspect-render.mjs
      - name: Revoke the run-only internal key
        if: always() && env.EVAL_API_KEY != ''
        run: mise exec -- pnpm --filter @promobento/cloud exec wrangler secret delete EVAL_API_KEY --env staging
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-staging-deployment
          path: artifacts/staging/
          if-no-files-found: warn
