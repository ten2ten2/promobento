name: Bind staging ModelSwitch key

# Secret-only maintenance. No Worker code/image deploy, model call or media check.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-staging-deploy
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - name: Install pinned CLI dependencies
        run: mise run install
      - name: Bind the existing Actions key through stdin and verify metadata
        env:
          MODEL_COMPAT_API_KEY: ${{ secrets.MODEL_COMPAT_API_KEY }}
        run: mise exec -- node apps/cloud/scripts/bind-model-secret.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: staging-model-key-binding
          path: artifacts/staging-model-key/binding.json
          if-no-files-found: warn
