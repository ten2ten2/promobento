name: Native pipeline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Run the needed native migration check
        type: choice
        options: [all, contracts, browser]
        default: all

permissions:
  contents: read
  actions: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'browser'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - name: Install pinned dependencies
        run: mise run install
      - name: Find last successful main ancestor
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- node scripts/select-ci-baseline.mjs
      - name: Use PR comparison base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "PROMOBENTO_BASE_REF=$PR_BASE_SHA" >> "$GITHUB_ENV"
      - name: Check current documentation and contracts
        run: mise run check:repo
      - name: Verify native revisions, authoring, cancellation, recovery and accounting
        run: mise run test:native
      - name: Type-check the cloud control plane
        run: mise run typecheck

  browser:
    if: github.event_name != 'workflow_dispatch' || inputs.suite != 'contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/render-container/Dockerfile
          target: browser-test
          tags: promobento-native-tests:ci
          load: true
          push: false
          cache-from: type=gha,scope=native-renderer
          cache-to: type=gha,mode=max,scope=native-renderer
      - name: Native preview, direct edit and 15/30 second exports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native
          chmod 0777 artifacts/native
          sudo apparmor_parser --replace apps/render-container/tests/apparmor.profile
          docker image inspect promobento-native-tests:ci --format '{{.Id}}' > artifacts/native/image-digest.txt
          docker run --rm --network none \
            --security-opt seccomp=unconfined --security-opt apparmor=promobento-browser-test \
            --cpus 4 --memory 6g --shm-size 1g --pids-limit 512 \
            -v "$PWD/artifacts/native:/artifacts" \
            promobento-native-tests:ci 2>&1 | tee artifacts/native/container.log
          test -s artifacts/native/native-smoke-report.json
          test -s artifacts/native/landscape-15.mp4
          test -s artifacts/native/portrait-30.mp4
      - name: Make isolated test artifacts readable by the runner
        if: always()
        shell: bash
        run: |
          if [ -d artifacts/native ]; then
            sudo chown -hR "$(id -u):$(id -g)" artifacts/native
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-browser-media
          path: artifacts/native/
          if-no-files-found: error
