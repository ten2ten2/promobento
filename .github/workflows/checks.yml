name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Run only the necessary check
        type: choice
        options: [all, contracts, browser, runtime, journey, media, audio, cloud-local, staging]
        default: all
      staging_sha:
        description: Already deployed SHA; staging-only harness repair without rebuilding or redeploying
        type: string
        default: ''
      staging_inspect_run:
        description: Read-only diagnosis of this prior staging run; no deployment, keys or render
        type: string
        default: ''
      staging_inspect_operation:
        description: Exact child operation from the inspected run; read-only, no replay
        type: string
        default: ''
      staging_reconcile_operation:
        description: Confirm stop and reconcile this one failed/cancelled internal operation before smoke
        type: string
        default: ''
      staging_renderer_sha:
        description: Existing renderer source SHA for a Worker-only repair; requires its registry digest
        type: string
        default: ''
      staging_renderer_digest:
        description: Existing renderer registry digest; renderer inputs must be unchanged from staging_renderer_sha
        type: string
        default: ''
      staging_scenario:
        description: New coverage only; lifecycle-recovery interrupts compute without repeating a complete movie
        type: choice
        options: [deploy-only, engineering, webgl-studio, webgl-film, lifecycle-recovery, director-preflight, g1-performance, g1-selection, g1-isolation]
        default: engineering

permissions:
  contents: read
  actions: read

concurrency:
  # Validate the latest branch tree; superseded runs need not finish.
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'browser' && inputs.suite != 'runtime' && inputs.suite != 'journey' && inputs.suite != 'media' && inputs.suite != 'audio' && inputs.suite != 'cloud-local' && inputs.suite != 'staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - name: Install pinned dependencies
        run: mise run install
      - name: Find last successful main ancestor
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- node scripts/select-ci-baseline.mjs
      - name: Use PR comparison base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "PROMOBENTO_BASE_REF=$PR_BASE_SHA" >> "$GITHUB_ENV"
      - name: Check repository, schemas and Studio reference
        run: mise run check:repo
      - name: Run Node unit tests
        run: mise run test

      - name: Type-check the cloud Worker
        run: mise run typecheck

  browser:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite != 'contracts' && inputs.suite != 'cloud-local' && inputs.suite != 'staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/render-container/Dockerfile
          target: browser-test
          tags: promobento-film-runtime-tests:ci
          load: true
          push: false
          cache-from: type=gha,scope=film-runtime-tests
          cache-to: type=gha,mode=max,scope=film-runtime-tests
      - name: Check only the changed pipeline contracts, adapters and confirmed eval cards
        if: inputs.suite != 'runtime' && inputs.suite != 'journey' && inputs.suite != 'media' && inputs.suite != 'audio'
        run: |
          docker run --rm --network none --entrypoint node promobento-film-runtime-tests:ci --test \
            packages/contracts/test/render-pipeline.test.mjs packages/models/test/adapters.test.mjs tests/evals/input-cards.test.mjs
      - name: Exercise trusted blocks in an offline, separate-uid Chromium sandbox
        if: inputs.suite != 'audio'
        shell: bash
        run: |
          mkdir -p artifacts/film-runtime
          chmod 0777 artifacts/film-runtime
          sudo apparmor_parser --replace apps/render-container/tests/apparmor.profile
          docker run --rm --network none --user 0 --security-opt seccomp=unconfined --security-opt apparmor=promobento-browser-test \
            -e PROMOBENTO_MEDIA_ONLY="${{ inputs.suite == 'media' && '1' || '0' }}" \
            -e PROMOBENTO_RUNTIME_ONLY="${{ inputs.suite == 'runtime' && '1' || '0' }}" \
            -e PROMOBENTO_JOURNEY_ONLY="${{ inputs.suite == 'journey' && '1' || '0' }}" \
            -e PROMOBENTO_TEST_IMAGE_DIGEST="$(docker image inspect promobento-film-runtime-tests:ci --format '{{.Id}}')" \
            --cpus 4 --memory 6g --shm-size 1g --pids-limit 512 \
            -v "$PWD/artifacts/film-runtime:/work/film-runtime" --entrypoint node \
            promobento-film-runtime-tests:ci apps/render-container/tests/init.mjs 2>&1 | tee artifacts/film-runtime/container.log
          test -s artifacts/film-runtime/report.json
      - name: Master only the two failed program styles
        if: inputs.suite == 'audio'
        shell: bash
        run: |
          mkdir -p artifacts/film-runtime
          chmod 0777 artifacts/film-runtime
          docker run --rm --network none --user 10001:10001 --cpus 4 --memory 6g \
            -v "$PWD/artifacts/film-runtime:/work/film-runtime" --entrypoint node \
            promobento-film-runtime-tests:ci apps/render-container/tests/audio.render.test.mjs 2>&1 | tee artifacts/film-runtime/container.log
          test -s artifacts/film-runtime/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: film-runtime-browser
          path: artifacts/film-runtime/
          if-no-files-found: error

  cloud-local:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'cloud-local'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - run: mise run install && mise run test:cloud-local

  staging:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'staging'
    uses: ./.github/workflows/cloud-deploy.yml
    with:
      reuse_deployment: ${{ inputs.staging_sha }}
      inspect_run: ${{ inputs.staging_inspect_run }}
      inspect_operation: ${{ inputs.staging_inspect_operation }}
      reconcile_operation: ${{ inputs.staging_reconcile_operation }}
      renderer_sha: ${{ inputs.staging_renderer_sha }}
      renderer_digest: ${{ inputs.staging_renderer_digest }}
      scenario: ${{ inputs.staging_scenario }}
    secrets: inherit
