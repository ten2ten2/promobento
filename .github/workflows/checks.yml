name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Validate the latest branch tree; superseded runs need not finish.
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - name: Install pinned dependencies
        run: mise run install
      - name: Find last successful main ancestor
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise exec -- node scripts/select-ci-baseline.mjs
      - name: Use PR comparison base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "PROMOBENTO_BASE_REF=$PR_BASE_SHA" >> "$GITHUB_ENV"
      - name: Check repository, schemas and Studio reference
        run: mise run check:repo
      - name: Run Node unit tests
        run: mise run test

  render:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - run: mise run install
      - name: Bind CI context and locate the pinned browser archive
        id: browser-archive
        run: mise exec -- node scripts/prepare-render-ci.mjs regression
      - name: Restore the pinned browser archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-archive.outputs.archive-path }}
          key: browser-archive-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser-archive.outputs.archive-sha256 }}
      - name: Install browser system libraries and the pinned Ubuntu FFmpeg build
        run: |
          mise exec -- pnpm --filter @promobento/renderer exec playwright-core install-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades ffmpeg=7:6.1.1-3ubuntu5
      - name: Install and verify official Chrome for Testing
        run: mise run install:renderer
      - name: Render real MP4 and verify deterministic frames
        run: mise run test:render
      - name: Preserve sample, environment and verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m0a-regression-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/m0a/
          retention-days: 30
          if-no-files-found: warn

  admission:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - run: mise run install
      - name: Build the pinned credential-free execution image
        run: mise run build:admission
      - name: Verify real task limits, hostile modules, cancellation and MP4 output
        run: mise run test:admission
      - name: Verify admitted text, images, PTS video and frozen audio
        run: mise run test:admission-media
      - name: Preserve isolation evidence, image identity and sample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m0a-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/admission-tests/
            artifacts/admission-media/
            artifacts/admission-image.json
          retention-days: 30
          if-no-files-found: warn

  media-output:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - run: mise run install
      - name: Bind CI context and locate the pinned browser archive
        id: browser-archive
        run: mise exec -- node scripts/prepare-render-ci.mjs output
      - name: Restore the pinned browser archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.browser-archive.outputs.archive-path }}
          key: browser-archive-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser-archive.outputs.archive-sha256 }}
      - name: Install browser system libraries and the pinned Ubuntu FFmpeg build
        run: |
          mise exec -- pnpm --filter @promobento/renderer exec playwright-core install-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades ffmpeg=7:6.1.1-3ubuntu5
      - name: Install and verify official Chrome for Testing
        run: mise run install:renderer
      - name: Measure the 30-second media fixture with required output checks
        run: mise run render:fixture -- --fixture media --mode output
      - name: Preserve output, timings, CI context and execution resources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m0a-media-output-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/m0a/
          retention-days: 30
          if-no-files-found: warn
