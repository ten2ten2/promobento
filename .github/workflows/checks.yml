name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5.1.0
        with:
          version: 2026.10.13
          cache: false
      - name: Install pinned dependencies
        run: mise run install
      - name: Check repository, schemas and Studio reference
        env:
          PROMOBENTO_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: mise run check:repo
      - name: Test contracts and canonical hash vectors
        run: mise run test:contracts
