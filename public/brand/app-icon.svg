<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>B5v3 — PromoBento rabbit with clapperboard badge</title>
  <defs>
    <clipPath id="head">
      <circle cx="510" cy="560" r="290"/>
    </clipPath>
  </defs>
  <!-- background -->
  <rect width="1024" height="1024" fill="#F0A868"/>
  <!-- ears (C2): left shortened, right folded; both clear of the top edge -->
  <path d="M 395 400 L 375 160" fill="none" stroke="#4A3B35" stroke-width="160" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 630 400 L 660 240 L 785 282" fill="none" stroke="#4A3B35" stroke-width="160" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- body (C1), runs off bottom-left -->
  <ellipse cx="390" cy="1010" rx="500" ry="300" fill="#FFF8EC"/>
  <!-- face: cream area below the hood line, clipped to the head (C1) -->
  <path d="M 0 360 C 160 380 470 360 530 430 Q 585 500 640 430 C 700 360 900 380 1024 360 V 1024 H 0 Z" fill="#FFF8EC" clip-path="url(#head)"/>
  <!-- hood with a rounded peak between the eyes, overlapping the face edge slightly (C2) -->
  <path d="M 0 0 H 1024 V 364 C 900 384 700 364 640 434 Q 585 504 530 434 C 470 364 160 384 0 364 Z" fill="#4A3B35" clip-path="url(#head)"/>
  <!-- eyes and nose: larger and lower for a baby face (C2) -->
  <circle cx="515" cy="600" r="38" fill="#4A3B35"/>
  <circle cx="665" cy="592" r="38" fill="#4A3B35"/>
  <ellipse cx="592" cy="667" rx="24" ry="17" fill="#4A3B35"/>
  <!-- chest badge: clapperboard aligned with the face, hinge joined at the left (C2),
       stripes reuse the background orange -->
  <rect x="478" y="916" width="224" height="100" rx="24" fill="#4A3B35"/>
  <g transform="rotate(-12 490 914)">
    <rect x="478" y="872" width="224" height="48" rx="20" fill="#4A3B35"/>
    <rect x="516" y="878" width="28" height="36" rx="12" fill="#F0A868"/>
    <rect x="572" y="878" width="28" height="36" rx="12" fill="#F0A868"/>
    <rect x="628" y="878" width="28" height="36" rx="12" fill="#F0A868"/>
  </g>
</svg>
