packages:
  - packages/*
  - apps/*
minimumReleaseAgeExclude:
  - miniflare@5.20261019.2-beta
  - wrangler@4.152.0

# The pinned Miniflare release predates Undici's TLS, redirect-cache and DoS fixes.
overrides:
  miniflare@5.20261019.2-beta>undici: 7.30.1

# Platform binaries arrive as optional dependencies; their install scripts are not needed.
allowBuilds:
  esbuild: false
  workerd: false
